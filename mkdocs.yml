site_name: Sales Demos Documentation
site_description: Demo documentation, talk tracks, and architecture guides
site_url: https://ericcames.github.io/sales.demos-docs
repo_url: https://github.com/ericcames/sales.demos-docs
repo_name: ericcames/sales.demos-docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tabs
    # Topics in the left nav are collapsible and start collapsed (#75):
    # navigation.sections rendered every group as a fixed, always-open header
    # and navigation.expand opened them all. navigation.indexes makes a topic's
    # first page (its Overview) the page its name opens.
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Demos:
      - Overview: demos/README.md
      - OpenShift Virtualization:
          - Overview: demos/openshift-virtualization/README.md
